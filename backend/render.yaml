services:
  - type: web
    name: oxyguard-v3
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: OXYGUARD_AUTH_EMAIL
        value: robertmarson88@gmail.com
      - key: OXYGUARD_EMAIL_FROM
        value: OxyGuard <onboarding@resend.dev>
      - key: RESEND_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL_SECONDS
        value: "900"
